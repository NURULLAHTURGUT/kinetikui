name: Component or feature idea
description: Suggest a new component, a variant of an existing one, or a CLI feature.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the motion or behaviour. A link to an example (an app, a video, a Dribbble shot) is the clearest way.
    validations:
      required: true

  - type: textarea
    id: use
    attributes:
      label: Where would you use it?
      description: The screen or the moment in an app where it would help. This decides most design choices.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you use today?
      description: An existing Kinetik component that comes close, another library, or your own code.

  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to build it myself (see CONTRIBUTING.md).
